<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Доска — Miroz</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <section id="screen-board" class="screen is-active">
    <header class="board-bar">
      <div class="board-menu">
        <button id="btn-menu" class="btn btn--ghost board-menu-btn" title="Меню">☰</button>
        <div id="board-menu" class="dropdown hidden">
          <a class="dropdown__item" href="index.html">В меню</a>
          <button id="menu-settings" class="dropdown__item" type="button">Настройки</button>
        </div>
      </div>
      <input id="board-title" class="board-title" value="Проект" spellcheck="false" />
      <button id="btn-project-info" class="btn btn--ghost board-title-edit board-title-info" type="button" title="Информация о проекте" aria-label="Информация о проекте">i</button>
      <button id="btn-project-settings" class="btn btn--ghost board-title-edit" type="button" title="Настройки проекта" aria-label="Настройки проекта">
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
        </svg>
      </button>
      <span id="board-slug" class="board-slug"></span>
      <div class="board-bar__spacer"></div>
      <div class="board-bar__tools">
        <button class="tool" type="button" data-tool="select" title="Выбор — выделять и перемещать объекты (V)"
          data-tip="Выбор · выделять и перемещать объекты (V)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 8-6.2 1.1L9.6 18z" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="tool" type="button" data-tool="sticky" title="Стикер — цветная заметка (S или 2)"
          data-tip="Стикер · цветная заметка (S или 2)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5"/></svg>
        </button>
        <button class="tool" type="button" data-tool="text" title="Текст — добавить текстовый блок (T или 3)"
          data-tip="Текст · добавить текстовый блок (T или 3)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M12 6v13M9 19h6"/></svg>
        </button>
        <button class="tool" type="button" data-tool="image" title="Изображение — вставить картинку с устройства (I или 5)"
          data-tip="Изображение · вставить картинку с устройства (I или 5)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="M21 16l-5.5-5.5L4 20"/></svg>
        </button>
        <div class="tool-figure">
          <button class="tool tool--tab" type="button" id="btn-arrow" data-tool="arrow"
            title="Стрелка — выбрать форму и провести линию (A)"
            data-tip="Стрелка · выбрать форму и провести линию (A)">
            <span id="arrow-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19L20 5"/><path d="M13 5h7v7"/></svg></span>
            <span class="tool__caret" aria-hidden="true">▾</span>
          </button>
          <div id="arrows-popover" class="figures-popover hidden">
            <div class="figures-popover__title">Стрелки</div>
            <div class="figures-popover__grid figures-popover__grid--arrows">
              <button class="figure-btn is-active" type="button" data-arrow-shape="straight" title="Прямая">
                <svg viewBox="0 0 24 24"><path d="M3 20L21 4"/><path d="M13 4h8v8"/></svg>
              </button>
              <button class="figure-btn" type="button" data-arrow-shape="elbow" title="Прямая вручную">
                <svg viewBox="0 0 24 24"><path d="M3 20H12V4H21"/><path d="M16 4h5v5"/></svg>
              </button>
              <button class="figure-btn" type="button" data-arrow-shape="curved" title="Гибкая">
                <svg viewBox="0 0 24 24"><path d="M3 20C9 20 15 4 21 4"/><path d="M15 4h6v6"/></svg>
              </button>
              <button class="figure-btn" type="button" data-arrow-shape="curved-manual" title="Гибкая вручную">
                <svg viewBox="0 0 24 24"><path d="M3 20C9 20 15 4 21 4"/><circle cx="9" cy="16" r="2"/><circle cx="15" cy="8" r="2"/><path d="M16 4h5v5"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="tool-figure">
          <button class="tool tool--tab" type="button" id="btn-figure" data-tool="frame"
            title="Фигуры — выбрать форму (F или 4)"
            data-tip="Фигуры · выбрать форму (F или 4)">
            <span id="figure-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1.5" stroke-dasharray="4 3"/></svg></span>
            <span class="tool__caret" aria-hidden="true">▾</span>
          </button>
          <div id="figures-popover" class="figures-popover hidden">
            <div class="figures-popover__title">Фигуры</div>
            <div class="figures-popover__grid">
              <button class="figure-btn is-active" type="button" data-figure="rect" title="Квадрат">
                <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
              </button>
              <button class="figure-btn" type="button" data-figure="rectangle" title="Прямоугольник">
                <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1"/></svg>
              </button>
              <button class="figure-btn" type="button" data-figure="ellipse" title="Эллипс">
                <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="6.5"/></svg>
              </button>
              <button class="figure-btn" type="button" data-figure="diamond" title="Ромб">
                <svg viewBox="0 0 24 24"><polygon points="12,3 21,12 12,21 3,12"/></svg>
              </button>
              <button class="figure-btn" type="button" data-figure="triangle" title="Треугольник">
                <svg viewBox="0 0 24 24"><polygon points="12,3 21,20 3,20"/></svg>
              </button>
              <button class="figure-btn" type="button" data-figure="triangle-down" title="Треугольник вниз">
                <svg viewBox="0 0 24 24"><polygon points="3,4 21,4 12,21"/></svg>
              </button>
              <button class="figure-btn" type="button" data-figure="circle" title="Круг">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="board-bar__spacer"></div>
      <div class="board-bar__zoom">
        <button id="zoom-out" class="btn btn--ghost" title="Уменьшить">−</button>
        <input id="zoom-value" class="zoom-value" type="text" inputmode="numeric" value="100%" title="Масштаб, %" spellcheck="false" />
        <button id="zoom-in" class="btn btn--ghost" title="Увеличить">+</button>
        <button id="zoom-reset" class="btn btn--ghost" title="Сбросить">⤢</button>
      </div>
      <div class="board-bar__users">
        <div id="presence" class="presence"></div>
      </div>
    </header>

    <div id="canvas-viewport" class="canvas-viewport" data-tool="select">
      <div id="canvas-world" class="canvas-world">
        <div class="canvas-grid"></div>
      </div>
      <div id="cursors" class="cursors-layer"></div>
      <div id="marquee" class="marquee hidden"></div>
    </div>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/config.js"></script>
  <!-- PROJECT_ID -->
  <script>window.PROJECT_ID = window.PROJECT_ID || new URLSearchParams(location.search).get('id');</script>
  <script src="js/storage.js"></script>
  <script src="js/images.js"></script>
  <script src="js/project-colors.js"></script>
  <script src="js/password.js"></script>
  <script src="js/access.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/presence.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/project-settings.js"></script>
  <script src="js/project-info.js"></script>
  <script src="js/board.js"></script>
  <script src="js/element-menu.js"></script>
  <script src="js/contextmenu.js"></script>
  <script src="js/board-page.js"></script>
</body>
</html>
