<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miroz</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ЭКРАН 0: вход -->
  <section id="screen-login" class="screen">
    <div class="login">
      <div class="login__card">
        <div class="login__logo">◆</div>
        <h1 class="login__title">Miroz</h1>
        <p class="login__subtitle">Войдите, чтобы работать с друзьями онлайн</p>
        <button id="btn-google" class="btn btn--google">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.1 0 24 0 14.6 0 6.4 5.4 2.5 13.2l7.8 6.1C12.2 13.1 17.6 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.1 5.3-4.5 7l7.6 5.9c4.4-4.1 6.6-10.1 6.6-17.4z"/>
            <path fill="#FBBC05" d="M10.3 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C.9 16.1 0 19.9 0 24s.9 7.9 2.5 10.8l7.8-6.1z"/>
            <path fill="#34A853" d="M24 48c6.1 0 11.3-2 15.1-5.5l-7.6-5.9c-2.1 1.4-4.8 2.3-7.5 2.3-6.4 0-11.8-3.6-13.7-8.8l-7.8 6.1C6.4 42.6 14.6 48 24 48z"/>
          </svg>
          Войти через Google
        </button>
        <p id="login-error" class="login__error hidden"></p>
      </div>
    </div>
  </section>

  <!-- ЭКРАН 1: список проектов -->
  <section id="screen-projects" class="screen">
    <header class="topbar">
      <div class="topbar__brand">
        <span class="logo">◆</span>
        <span class="logo-text">Miroz</span>
      </div>
      <div class="topbar__actions">
        <span id="user-badge" class="user-badge" title="Не авторизован">Гость</span>
        <button id="btn-logout" class="btn btn--ghost">Выйти</button>
      </div>
    </header>

    <main class="projects">
      <div class="projects__head">
        <h1>Мои проекты</h1>
        <button id="btn-create-project" class="btn btn--primary">+ Создать проект</button>
      </div>

      <div id="projects-grid" class="projects__grid"></div>

      <div id="projects-empty" class="empty hidden">
        <p class="empty__title">Пока нет проектов</p>
        <p class="empty__text">Создайте первый проект, чтобы начать работу.</p>
      </div>
    </main>
  </section>

  <!-- ЭКРАН 2: доска -->
  <section id="screen-board" class="screen">
    <header class="board-bar">
      <button id="btn-back" class="btn btn--ghost" title="К списку проектов">← Проекты</button>
      <input id="board-title" class="board-title" value="Проект" spellcheck="false" />
      <div class="board-bar__spacer"></div>
      <div class="board-bar__tools">
        <button class="tool" data-tool="select" title="Выбор">⇱</button>
        <button class="tool" data-tool="sticky" title="Стикер">▭</button>
        <button class="tool" data-tool="text" title="Текст">T</button>
        <button class="tool" data-tool="frame" title="Фрейм">▢</button>
      </div>
      <div class="board-bar__spacer"></div>
      <div class="board-bar__zoom">
        <button id="zoom-out" class="btn btn--ghost" title="Уменьшить">−</button>
        <span id="zoom-value" class="zoom-value">100%</span>
        <button id="zoom-in" class="btn btn--ghost" title="Увеличить">+</button>
        <button id="zoom-reset" class="btn btn--ghost" title="Сбросить">⤢</button>
      </div>
      <div class="board-bar__users">
        <div id="presence" class="presence"></div>
      </div>
    </header>

    <div id="canvas-viewport" class="canvas-viewport" data-tool="select">
      <div id="canvas-world" class="canvas-world">
        <div class="canvas-grid"></div>
      </div>
      <div id="canvas-hint" class="canvas-hint">Выберите инструмент и нажмите на холст</div>
    </div>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/board.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
