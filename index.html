<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miroz</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ЭКРАН 0: вход -->
  <section id="screen-login" class="screen">
    <div class="login">
      <div class="login__card">
        <div class="login__logo">◆</div>
        <h1 class="login__title">Miroz</h1>
        <p class="login__subtitle">Войдите, чтобы работать с друзьями онлайн</p>
        <button id="btn-google" class="btn btn--google">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.1 0 24 0 14.6 0 6.4 5.4 2.5 13.2l7.8 6.1C12.2 13.1 17.6 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.1 5.3-4.5 7l7.6 5.9c4.4-4.1 6.6-10.1 6.6-17.4z"/>
            <path fill="#FBBC05" d="M10.3 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C.9 16.1 0 19.9 0 24s.9 7.9 2.5 10.8l7.8-6.1z"/>
            <path fill="#34A853" d="M24 48c6.1 0 11.3-2 15.1-5.5l-7.6-5.9c-2.1 1.4-4.8 2.3-7.5 2.3-6.4 0-11.8-3.6-13.7-8.8l-7.8 6.1C6.4 42.6 14.6 48 24 48z"/>
          </svg>
          Войти через Google
        </button>
        <p id="login-error" class="login__error hidden"></p>
      </div>
    </div>
  </section>

  <!-- ЭКРАН 1: список проектов -->
  <section id="screen-projects" class="screen">
    <header class="topbar">
      <div class="topbar__brand">
        <span class="logo">◆</span>
        <span class="logo-text">Miroz</span>
      </div>
      <div class="topbar__actions">
        <span id="user-badge" class="user-badge" title="Не авторизован">Гость</span>
        <button id="btn-logout" class="btn btn--ghost">Выйти</button>
      </div>
    </header>

    <main class="projects">
      <div class="projects__head">
        <h1>Мои проекты</h1>
        <button id="btn-create-project" class="btn btn--primary">+ Создать проект</button>
      </div>

      <div id="projects-grid" class="projects__grid"></div>

      <div id="projects-empty" class="empty hidden">
        <p class="empty__title">Пока нет проектов</p>
        <p class="empty__text">Создайте первый проект, чтобы начать работу.</p>
      </div>
    </main>
  </section>

  <!-- Модалка создания проекта -->
  <div id="modal-create" class="modal hidden">
    <div class="modal__backdrop" data-close="modal-create"></div>
    <div class="modal__card">
      <h2 class="modal__title">Новый проект</h2>

      <label class="field">
        <span class="field__label">ID проекта <em>— латиница, изменить нельзя</em></span>
        <input id="np-id" class="field__input" placeholder="my-project" autocomplete="off" spellcheck="false" />
        <span class="field__hint">a–z, 0–9, дефис и подчёркивание. Станет адресом: <code id="np-preview">/my-project.html</code></span>
      </label>

      <label class="field">
        <span class="field__label">Название <em>— можно менять потом</em></span>
        <input id="np-name" class="field__input" placeholder="Мой проект" autocomplete="off" />
      </label>

      <p id="np-error" class="field__error hidden"></p>

      <div class="modal__actions">
        <button id="np-cancel" class="btn btn--ghost">Отмена</button>
        <button id="np-create" class="btn btn--primary">Создать</button>
      </div>
    </div>
  </div>

  <!-- Модалка настроек проекта -->
  <div id="modal-settings" class="modal hidden">
    <div class="modal__backdrop" data-close="modal-settings"></div>
    <div class="modal__card">
      <h2 class="modal__title">Настройки проекта</h2>

      <div class="field">
        <span class="field__label">Обложка <em>— ссылка на картинку</em></span>
        <div id="sp-cover-preview" class="cover-preview">
          <span id="sp-cover-empty">Нет обложки</span>
          <img id="sp-cover-img" class="hidden" alt="" />
        </div>
        <input id="sp-cover" class="field__input" placeholder="https://…" autocomplete="off" spellcheck="false" />
      </div>

      <label class="field">
        <span class="field__label">Название</span>
        <input id="sp-name" class="field__input" autocomplete="off" />
      </label>

      <label class="field">
        <span class="field__label">ID <em>— изменить нельзя</em></span>
        <input id="sp-id" class="field__input" readonly />
        <span class="field__hint">Адрес доски: <code id="sp-url"></code></span>
      </label>

      <p id="sp-error" class="field__error hidden"></p>

      <div class="modal__actions modal__actions--spread">
        <button id="sp-delete" class="btn btn--danger">Удалить проект</button>
        <span>
          <button id="sp-cancel" class="btn btn--ghost" data-close="modal-settings">Отмена</button>
          <button id="sp-save" class="btn btn--primary">Сохранить</button>
        </span>
      </div>

      <div id="sp-confirm" class="danger hidden">
        <p class="danger__text">
          Удаление необратимо. Введите ID проекта <code id="sp-confirm-id"></code>,
          чтобы подтвердить.
        </p>
        <input id="sp-confirm-input" class="field__input" placeholder="введите ID" autocomplete="off" spellcheck="false" />
        <div class="modal__actions">
          <button id="sp-confirm-cancel" class="btn btn--ghost">Отмена</button>
          <button id="sp-confirm-delete" class="btn btn--danger" disabled>Удалить навсегда</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
